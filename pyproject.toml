[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "S"]
ignore = [
    "S101",   # assert 在测试中合法
    "E501",   # 行长由 formatter 控制
    "RUF001", # 中文文案使用全角标点，属正常
    "RUF002",
    "RUF003",
    "UP045",  # 有意使用 Optional[X] 以兼容 Python 3.9
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
